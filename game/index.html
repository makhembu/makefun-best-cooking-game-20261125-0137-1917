<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillet Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a120c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Skillet Rush: a top-down cooking game. Move the chef with WASD or the arrow keys, grab ingredients from the pantry, chop at the board, cook on the stove, plate the dish and serve it at the window before the order timer runs out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
